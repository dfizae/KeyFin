# Import from a deployment-owned, ignored application-local.properties after replacing values.
# Credentials belong to the backend only. NEVER use EXPO_PUBLIC_* for any AI token.
coaching.enabled=false
coaching.base-url=https://replace-with-private-ai-service.invalid
coaching.timeout=60s
# One distinct Python client token per authenticated KeyFin user, with matching data ownership.
# coaching.user-tokens[123]=${AI_COACHING_USER_123_TOKEN}
# Optional, separate Python backend-role token for the same owner. Never reuse a read-role token.
# coaching.backend-tokens[123]=${AI_COACHING_BACKEND_123_TOKEN}
# Optional, separate Python notification-role token for this same owner.
# coaching.notification-tokens[123]=${AI_COACHING_NOTIFICATION_123_TOKEN}
# Optional source sync: same owner as the corresponding Python backend-role token.
# No account number or provider identity belongs in this value.
# coaching.owner-ids[123]=${AI_COACHING_OWNER_123}
# Requires develop V1..V7 followed by V8, owner/write tokens and supported source facts.
coaching.source-sync-enabled=false
coaching.source-sync-delay-ms=30000
